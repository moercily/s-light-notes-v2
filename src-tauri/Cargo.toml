[package]
name = "s-light-notes"
version = "2.0.0-alpha.0"
description = "P2P synced Markdown notes powered by Syncthing"
authors = ["s-light notes contributors"]
edition = "2021"

[lib]
name = "s_light_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
opener = "0.7"
ureq = { version = "2", features = ["json"] }
