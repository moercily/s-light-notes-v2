name: Desktop native validation
on:
  push:
    branches: [main, codex/reliability-and-release]
  pull_request:
  workflow_dispatch:
    inputs:
      platforms:
        description: Native platforms to validate (no local windows)
        type: choice
        default: windows-linux
        options: [windows-linux, all]
      package_run:
        description: Optional successful packaging run ID to reuse installers for test-script-only changes
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: desktop-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.platforms == 'windows-linux' && '[{"runner":"windows-2022","target":"x86_64-pc-windows-msvc","bundles":"nsis"},{"runner":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","bundles":"deb,appimage"}]' || '[{"runner":"macos-15","target":"aarch64-apple-darwin","bundles":"app,dmg"},{"runner":"macos-15-intel","target":"x86_64-apple-darwin","bundles":"app,dmg"},{"runner":"windows-2022","target":"x86_64-pc-windows-msvc","bundles":"nsis"},{"runner":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","bundles":"deb,appimage"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: inputs.package_run == ''
        with:
          node-version: '22'
          cache: npm
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
          sudo apt-get install -y xvfb openbox dbus-x11 python3-pyatspi xdotool x11-utils
      - name: Prepare native Rust
        if: inputs.package_run == ''
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
      - name: Frontend regression
        if: inputs.package_run == ''
        run: |
          npm ci
          npm test
      - name: Rust regression
        if: inputs.package_run == ''
        run: cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --locked --lib
      - name: Isolated native P2P engines
        if: inputs.package_run == ''
        run: npm run test:p2p
      - name: Package native application
        if: inputs.package_run == ''
        run: npm run tauri:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci -- --locked
      - name: Collect installers and checksums
        if: inputs.package_run == ''
        run: node scripts/collect-desktop-release.mjs src-tauri/target/${{ matrix.target }}/release/bundle release/${{ matrix.target }}
      - name: Reuse existing installers for focused acceptance
        if: inputs.package_run != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN: ${{ inputs.package_run }}
        run: |
          [[ "$PACKAGE_RUN" =~ ^[0-9]+$ ]] || exit 1
          source_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PACKAGE_RUN" --jq .head_sha)
          [[ "$source_sha" =~ ^[a-f0-9]{40}$ ]] || exit 1
          git fetch --no-tags --depth=1 origin "$source_sha"
          git diff --exit-code "$source_sha" HEAD -- app src-tauri package.json package-lock.json
          gh run download "$PACKAGE_RUN" --repo "$GITHUB_REPOSITORY" --name desktop-${{ matrix.target }} --dir release/${{ matrix.target }}
          node scripts/verify-release-checksums.mjs release/${{ matrix.target }}
      - name: Windows installed application smoke test
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $installers = @(Get-ChildItem 'release/${{ matrix.target }}/*.exe')
          if ($installers.Count -ne 1) { throw 'Expected one NSIS installer.' }
          ./scripts/test-windows-startup.ps1 -Installer $installers[0].FullName
      - name: Linux installed application acceptance in virtual display
        if: runner.os == 'Linux'
        run: |
          sudo dpkg -i release/${{ matrix.target }}/*.deb
          dbus-run-session -- xvfb-run -a python3 scripts/test-linux-startup.py
      - name: Verify macOS bundle signature and architecture
        if: runner.os == 'macOS' && inputs.package_run == ''
        run: node scripts/verify-macos-bundle.mjs "src-tauri/target/${{ matrix.target }}/release/bundle/macos/s-light notes.app"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: acceptance-${{ matrix.target }}
          path: release/qa/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && inputs.package_run == ''
        with:
          name: desktop-${{ matrix.target }}
          path: release/${{ matrix.target }}/
          if-no-files-found: warn
          retention-days: 14
